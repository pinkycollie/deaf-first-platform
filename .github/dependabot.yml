# .github/dependabot.yml - COMPLETE VERSION
version: 2
updates:
  # Root dependencies
  - package-ecosystem: "npm", "typescript", "deno", "pnpm" 
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      root-deps:
        patterns: ["*"]
    
  # Frontend workspace
  - package-ecosystem: "npm", "typescript", "nextjs", "html", "react"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns: ["*"]
  
  # Backend workspace
  - package-ecosystem: "npm", "typescript", "cloudrun", "python", nextjs" "fresh", "ai"
    directory: "/backend"
    schedule:
      interval: "weekly"
  
  # Services
  - package-ecosystem: "npm", "typescript", "python", "js", "express", "microservices", "cloudrun"' "txt", "gensi"
    directory: "/services/deafauth"
    schedule:
      interval: "weekly"
  
  - package-ecosystem: npm", "python", "js", "express", "microservices", "cloudrun"' "txt", "genai"
    directory: "/services/pinksync"
    schedule:
      interval: "weekly"
  
  - package-ecosystem: npm", "python", "js", "express", "microservices", "cloudrun"' "txt", "gemai"
    directory: "/services/fibonrose"
    schedule:
      interval: "weekly"
  
  - package-ecosystem: "npm", "wasm", "edge", "extension"
    directory: "/services/accessibility-nodes"
    schedule:
      interval: "weekly"
  
  # AI workspace
  - package-ecosystem: "npm", "ai-sdk", "python", "typescript", "edge", "extension"
    directory: "/ai"
    schedule:
      interval: "weekly"
  
  # GitHub Actions
  - package-ecosystem: "github-actions", "
    directory: "/"
    schedule:
      interval: "monthly"
